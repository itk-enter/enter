# https://github.com/ScorpioBroker/ScorpioBroker/tree/development-quarkus

# Service templates extended in docker-compose.yml and docker-compose.server.yml.

services:
  scorpio:
    # https://hub.docker.com/r/scorpiobroker/all-in-one-runner/tags
    # https://hub.docker.com/layers/scorpiobroker/all-in-one-runner/java-6.0.2
    image: scorpiobroker/all-in-one-runner:java-6.0.2
    environment:
      - HTTP_EXPOSE=9090:9999
      - DBHOST=scorpio-db
      - SCORPIO_POSTGRES_USERNAME=${SCORPIO_POSTGRES_USERNAME:-enter}
      - SCORPIO_POSTGRES_PASSWORD=${SCORPIO_POSTGRES_PASSWORD:-enter}
      - SCORPIO_POSTGRES_DATABASE_NAME=${SCORPIO_POSTGRES_DATABASE:-enter}
    depends_on:
      - "scorpio-db"
    networks:
      - scorpio

  scorpio-db:
    # https://hub.docker.com/r/postgis/postgis/tags?name=18
    # https://hub.docker.com/layers/postgis/postgis/18-3.6
    image: postgis/postgis:18-3.6
    environment:
      - POSTGRES_PASSWORD=${SCORPIO_POSTGRES_ROOT_PASSWORD:-*}
      - SCORPIO_POSTGRES_USERNAME=${SCORPIO_POSTGRES_USERNAME:-enter}
      - SCORPIO_POSTGRES_PASSWORD=${SCORPIO_POSTGRES_PASSWORD:-enter}
      - SCORPIO_POSTGRES_DATABASE=${SCORPIO_POSTGRES_DATABASE:-enter}
    networks:
      - scorpio
    volumes:
      # https://www.w3tutorials.net/blog/how-to-create-user-database-in-script-for-docker-postgres/
      - ../scorpio/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh
