api:
    title: API
    intro: Læs dataene i brokeren med GET-forespørgsler.
    intro_more: Åbn et endpoint for at se dets parametre, et eksempel og svaret.
    example: Eksempel
    response: Svar
    response_shortened: Svar, forkortet
    parameters: Parametre
    headers: Headers
    sources:
        label: Listen over datasæt
        text_html: >-
            Viser datasættene. Hvert datasæt har et <code>id</code>, en <code>title</code>, en <code>model</code>, modellens
            <code>context_url</code> og den <code>entities_url</code>, der vælger dets entiteter. Et samlet datasæt har også
            de <code>inputs</code>, det er samlet fra.
        example: Alle datasættene
    types:
        label: Typerne i brokeren
        text: Viser typerne af entiteterne i brokeren.
        example: Alle typerne
    entities:
        label: Entiteterne, der passer til en forespørgsel
        text_html: Viser entiteterne, der passer til forespørgslen. Angiv en <code>type</code>, en <code>q</code> eller begge.
        type: Den fulde URI for en type.
        q_html: Et filter på attributterne, for eksempel <code>sourceId=="osm-bench"</code>.
        simplified: Giver kun værdien af hver attribut, uden NGSI-LD-strukturen omkring den.
        attrs_html: Giver kun attributterne i listen, for eksempel <code>location</code>.
        paging_html: >-
            Giver én side af resultatet. Hvis der er en næste side, peger svarets <code>Link</code>-header på den.
        count_html: Tilføjer headeren <code>NGSILD-Results-Count</code> med antallet af alle de entiteter, der passer.
        near_html: >-
            Find entiteter nær et punkt, for eksempel <code>georel=near;maxDistance==300</code>,
            <code>geometry=Point</code> og <code>coordinates=[10.2039,56.1572]</code>. Koordinaterne er længdegrad og derefter
            breddegrad, og afstanden er i meter.
        accept_html: >-
            <code>application/ld+json</code> giver JSON-LD med konteksten i svaret. <code>application/json</code> giver
            almindelig JSON. <code>application/geo+json</code> giver en GeoJSON-featurecollection, som kortbiblioteker kan vise.
        link_html: >-
            JSON-LD-konteksten for en datamodel, for eksempel et datasæts <code>context_url</code>. Med den bruger svaret
            modellens korte attributnavne, og <code>type</code>, <code>q</code> og <code>attrs</code> kan også bruge de korte
            navne, for eksempel <code>Bench</code>.
        example: Én entitet fra datasættet osm-bench, kun med værdierne
    entity:
        label: Én entitet
        text_html: >-
            Giver én entitet. Id'et er entitetens <code>id</code> i en liste over entiteter. Uden
            <code>format=simplified</code> er hver attribut et objekt med en type og en værdi.
        example: Én bænk
