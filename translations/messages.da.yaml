merged:
    from: Samlet fra %count% datasæt|Samlet fra %count% datasæt
    intro_html: >-
        En konflikt er en attribut, som datasættene angiver med forskellige værdier, og som ingen af sammenlægningens
        metoder afgør. Den samlede entitet har ikke attributten. Den gemmer datasættenes værdier i
        <code>additionalInformation.conflicts</code>. Siden viser de samlede entiteter, som sammenlægningens seneste kørsel
        udgav.
    broker_unavailable: Brokeren er ikke tilgængelig, så siden kan ikke vise konflikterne.
    no_conflicts: Ingen konflikter
    all_settled: Sammenlægningen afgjorde hver attribut, som datasættene er uenige om.
    conflicts: "%count% konflikt|%count% konflikter"
    entities_in_conflict: samlet entitet har en konflikt|samlede entiteter har en konflikt
