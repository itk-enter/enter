# The English texts of the pages. Danish is the default language, see messages.da.yaml.
# A key that ends in "_html" holds HTML, and the template shows it with |trans|raw. Do not put data in such a text.
# A text with "|" has a singular and a plural form. The parameter %count% selects the form.

