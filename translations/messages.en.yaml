merged:
    from: Merged from %count% data set|Merged from %count% data sets
    intro_html: >-
        A conflict is an attribute that the data sets state with different values, and that no approach of the merge
        settles. The merged entity does not have the attribute. It keeps the values of the data sets in
        <code>additionalInformation.conflicts</code>. The page shows the merged entities that the last run of the merge
        published.
    broker_unavailable: The broker is not available, so the page cannot show the conflicts.
    no_conflicts: No conflicts
    all_settled: The merge settled each attribute that the data sets disagree on.
    conflicts: "%count% conflict|%count% conflicts"
    entities_in_conflict: merged entity has a conflict|merged entities have a conflict
    attributes_in_conflict: attribute in conflict|attributes in conflict
    map:
        title: Where the conflicts are
        label: Map of the merged entities with conflicts
        help: Select a point to see the attributes in conflict.
    attributes:
        title: Attributes in conflict
        help: The number of merged entities with a conflict on each attribute.
    data_sets:
        title: Data sets in the conflicts
        help: The number of conflicts that each data set states a value in.
    entities:
        title: Merged entities with conflicts
        from: from %data_set%
        record: The entity in the data set
    card:
        conflicts: Conflicts
        no_inputs: No data set publishes its models.

test_map:
    title: Test map
    intro: See the test data sets on a map.
    intro_more: Select the data sets in the panel, and click an object on the map to see its data.
    models: Data models
    loading: Loading data sets…

api:
    title: API
    intro: Read the data in the broker with GET requests.
    intro_more: Open an endpoint to see its parameters, an example and the response.
    example: Example
    response: Response
    response_shortened: Response, shortened
    parameters: Parameters
    headers: Headers
    sources:
        label: The list of data sets
        text_html: >-
            Lists the data sets. Each data set has an <code>id</code>, a <code>title</code>, a <code>model</code>, the
            <code>context_url</code> of the model and the <code>entities_url</code> that selects its entities. A merged data
            set also has the <code>inputs</code> that it is merged from.
        example: All the data sets
    types:
        label: The types in the broker
        text: Lists the types of the entities in the broker.
        example: All the types
    entities:
        label: The entities that match a query
        text_html: Lists the entities that match the query. Give a <code>type</code>, a <code>q</code> or both.
        type: The full URI of a type.
        q_html: A filter on the attributes, for example <code>sourceId=="osm-bench"</code>.
        simplified: Gives the value of each attribute only, without the NGSI-LD structure around it.
        attrs_html: Gives only the attributes in the list, for example <code>location</code>.
        paging_html: >-
            Give one page of the result. If there is a next page, the <code>Link</code> header of the response points to it.
        count_html: Adds the header <code>NGSILD-Results-Count</code> with the number of all the entities that match.
        near_html: >-
            Find entities near a point, for example <code>georel=near;maxDistance==300</code>, <code>geometry=Point</code>
            and <code>coordinates=[10.2039,56.1572]</code>. The coordinates are longitude, then latitude, and the distance
            is in metres.
        accept_html: >-
            <code>application/ld+json</code> gives JSON-LD, with the context in the body. <code>application/json</code> gives
            plain JSON. <code>application/geo+json</code> gives a GeoJSON feature collection, which map libraries can show.
        link_html: >-
            The JSON-LD context of a data model, for example the <code>context_url</code> of a data set. With it, the
            response uses the short attribute names of the model, and <code>type</code>, <code>q</code> and
            <code>attrs</code> can use the short names too, for example <code>Bench</code>.
        example: One entity of the data set osm-bench, with the values only
    entity:
        label: One entity
        text_html: >-
            Gives one entity. The id is the <code>id</code> of the entity in a list of entities. Without
            <code>format=simplified</code>, each attribute is an object with a type and a value.
        example: One bench
