<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" role="img" aria-label="Data about the area fills in missing details; it never adds or changes places">
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
    text { fill: #1f2328; }
    .title { font-size: 15px; font-weight: 600; }
    .q { font-size: 11.5px; fill: #59636e; }
    .c { font-size: 11.5px; fill: #8250df; }
    .s { font-size: 11.5px; }
    .n { font-weight: 600; }
    .m { text-anchor: middle; }
    .box { fill: #ffffff; stroke: #8c959f; stroke-width: 1.25; }
    .area { fill: #8250df; fill-opacity: 0.08; stroke: #8250df; stroke-width: 1.25; stroke-dasharray: 5 3; }
    .place { fill: #0969da; }
    .outside { fill: #8c959f; }
  </style>
  <rect x="0" y="0" width="760" height="332" rx="12" fill="#f6f8fa"/>

  <text class="title" x="24" y="34">Data about the area fills in missing details; it never adds or changes places</text>
  <text class="q" x="24" y="54">Example: district areas give each merged toilet the district it lies in</text>

  <!-- Left panel: an area reaching the places inside it -->
  <rect class="box" x="24" y="72" width="412" height="236" rx="8"/>
  <polygon class="area" points="48,120 330,100 380,200 300,280 70,260"/>
  <text class="n" x="64" y="142">District area: Højbjerg</text>

  <circle class="place" cx="140" cy="178" r="6"/>
  <text class="s m" x="140" y="198">+ district: Højbjerg</text>

  <circle class="place" cx="220" cy="230" r="6"/>
  <text class="s m" x="220" y="250">+ district: Højbjerg</text>

  <circle class="place" cx="300" cy="150" r="6"/>
  <text class="q m" x="300" y="170">already stated: kept</text>

  <circle class="outside" cx="400" cy="268" r="6"/>
  <text class="q" x="424" y="292" text-anchor="end">outside: unchanged</text>

  <!-- Right panel: the rules -->
  <rect class="box" x="452" y="72" width="284" height="236" rx="8"/>
  <text class="n" x="468" y="100">Rules for augmentation</text>
  <text x="468" y="128">Only fills details that are missing</text>
  <text x="468" y="152">Never overrides the sources</text>
  <text x="468" y="176">Never creates or moves places</text>
  <text x="468" y="200">An area reaches all places inside</text>
  <text x="468" y="224">A point reaches places nearby</text>
  <text class="c" x="468" y="268">Configured: which datasets add</text>
  <text class="c" x="468" y="284">which details, and how they reach</text>
</svg>
