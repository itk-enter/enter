networks:
    scorpio:

services:
    phpfpm:
        image: enter-fpm:alpine
        # We want to use GEOS in PHP, cf. https://geophp.net/geos.html.
        build:
            # Notice: $ must be quoted (doubled) when used inside dockerfile_inline
            dockerfile_inline: |
                # Lifted from https://github.com/farmOS/farmOS/blob/4.x/docker/Dockerfile
                FROM itkdev/php8.5-fpm:alpine

                USER root

                # Build and install the GEOS PHP extension.
                # https://github.com/libgeos/php-geos/blob/master/README.md#building
                # See https://git.osgeo.org/gitea/geos/php-geos
                # See https://github.com/libgeos/php-geos

                # https://github.com/libgeos/php-geos/commit/1a1c6a95697359892886a2050570007754ce575e
                ARG PHP_GEOS_VERSION=1a1c6a95697359892886a2050570007754ce575e

                ADD https://github.com/libgeos/php-geos/archive/$${PHP_GEOS_VERSION}.tar.gz /opt/php-geos.tar.gz
                RUN apk update && apk add build-base geos-dev autoconf \
                  && ( tar xzf /opt/php-geos.tar.gz -C /opt/ \
                    && cd /opt/php-geos-$${PHP_GEOS_VERSION} \
                    && ./autogen.sh \
                    && ./configure \
                    && make \
                    && make install \
                    )

                RUN cat > /usr/local/etc/php/conf.d/docker-php-ext-geos.ini <<'EOF'
                ; configuration for php common module
                ; priority=20
                extension=geos
                EOF

                # RUN phpenmod -s ALL geos

                USER deploy

        depends_on:
            rabbit:
                condition: service_healthy

    # The message broker of Symfony Messenger.
    rabbit:
        image: rabbitmq:4-management-alpine
        restart: unless-stopped
        networks:
            - app
        environment:
            - "RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}"
            - "RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}"
            - "RABBITMQ_ERLANG_COOKIE=${RABBITMQ_ERLANG_COOKIE}"
        volumes:
            - ".docker/data/rabbitmq:/var/lib/rabbitmq/mnesia/"
        healthcheck:
            test: ["CMD", "nc", "-z", "-w", "2", "127.0.0.1", "5672"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 60s
            start_interval: 1s

    # Runs the Messenger worker, which handles the messages in RabbitMQ.
    supervisor:
        image: itkdev/supervisor-php8.5:alpine
        restart: unless-stopped
        stop_grace_period: 20s
        environment:
            - APP_SUPERVISOR_COMMAND=/app/bin/console messenger:consume --env=prod --no-debug --time-limit=900 async
            - APP_SUPERVISOR_WORKERS=1
            - APP_SUPERVISOR_USER=deploy
            # A backstop only: --time-limit ends the process first.
            - PHP_MAX_EXECUTION_TIME=1800
            - PHP_MEMORY_LIMIT=256M
            - PHP_TIMEZONE=UTC
        networks:
            - app
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - .:/app
        depends_on:
            rabbit:
                condition: service_healthy

    scorpio:
        image: scorpiobroker/all-in-one-runner:java-latest
        restart: unless-stopped
        ports:
            - "9090"
        environment:
            - DBHOST=scorpio-db
        depends_on:
            - "scorpio-db"
        networks:
            app:
                aliases: [scorpio.local]
            scorpio:
        platform: "linux/amd64"

    scorpio-db:
        image: postgis/postgis:18-3.6
        restart: unless-stopped
        environment:
            - POSTGRES_USER=ngb
            - POSTGRES_PASSWORD=ngb
            - POSTGRES_DB=ngb
        healthcheck:
            test: ["CMD-SHELL", "pg_isready --username=ngb --dbname=ngb"]
            start_period: 10s
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - scorpio
        volumes:
            - ./.docker/data/postgresql:/var/lib/postgresql
