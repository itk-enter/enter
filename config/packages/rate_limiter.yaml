framework:
    # https://symfony.com/doc/current/rate_limiter.html
    rate_limiter:
        # The request limit of the lookups transport: 60 requests each minute.
        # A service with a limit of its own gets a limiter of its own.
        lookups:
            policy: 'fixed_window'
            limit: 60
            interval: '1 minute'
        # The aerial photos of Dataforsyningen: 5 requests each second.
        lookup_aerial_photos:
            policy: 'fixed_window'
            limit: 5
            interval: '1 second'
