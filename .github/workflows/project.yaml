name: Enter

env:
    COMPOSE_USER: runner

on:
    pull_request:
    push:
        branches:
            - main
            - develop

jobs:
    misc:
        name: Miscellaneus
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: go-task/setup-task@v2

            - name: Create docker network
              run: docker network create frontend

            - name: Code analysis
              run: task code-analysis

            - name: Run tests
              run: task test
